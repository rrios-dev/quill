name: ci

# Copied to github.com/rrios-dev/quill by Scripts/export-public.sh. The checks
# live in Scripts/ci.sh, which Scripts/verify.sh also runs first in the
# monorepo; this file only picks the machine.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    defaults:
      run:
        working-directory: native/quill
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The newest Xcode on the runner, never an older default: Quill uses the
      # newest FoundationModels API the SDK offers.
      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
      - run: ./Scripts/ci.sh
